<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fotogalleri fra Vikerkleiva foto.">
  <title>Galleri | Vikerkleiva foto</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#innhold">Hopp til innhold</a>

  <header class="site-header">
    <a class="logo" href="../">Vikerkleiva foto</a>
    <nav aria-label="Hovedmeny">
      <ul class="nav-list">
        <li><a href="../">Forside</a></li>
        <li><a href="./" aria-current="page">Galleri</a></li>
        <li><a href="../om/">Om</a></li>
        <li><a href="../kontakt/">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main id="innhold" class="page">
    <header class="page-header">
      <p class="eyebrow">Utvalgte fotografier</p>
      <h1>Galleri</h1>
      <p>
        Et utvalg fotografier fra naturen og nærområdet. Flere bilder og egne
        kategorier kommer etter hvert.
      </p>
    </header>

    <section class="gallery" aria-label="Fotogalleri">
      <figure class="gallery-item">
        <img
          src="../bilder/galleri/bater-vikersund.jpg"
          alt="To eldre robåter fortøyd ved vannkanten"
          width="1319"
          height="1320"
          loading="lazy"
        >
      </figure>
      <figure class="gallery-item">
        <img
          src="../bilder/galleri/utsikt-vikersund.jpg"
          alt="Utsikt over Vikersund og en tåkekledd åsside"
          width="990"
          height="1759"
          loading="lazy"
        >
      </figure>
      <figure class="gallery-item">
        <img
          src="../bilder/galleri/sauer-pa-beite.jpg"
          alt="Søye og lam på et sommerbeite"
          width="1760"
          height="1320"
          loading="lazy"
        >
      </figure>
      <figure class="gallery-item">
        <img
          src="../bilder/galleri/eikeblad-med-regn.jpg"
          alt="Regndråper på et eikeblad i svart-hvitt"
          width="959"
          height="1703"
          loading="lazy"
        >
      </figure>
      <figure class="gallery-item">
        <img
          src="../bilder/galleri/morgentake-over-vannet.jpg"
          alt="Morgentåke over stille vann med gamle trepåler"
          width="900"
          height="1600"
          loading="lazy"
        >
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span data-year>2026</span> Vikerkleiva foto</p>
  </footer>
</body>
</html>
